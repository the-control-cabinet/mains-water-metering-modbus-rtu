# Complete "Water" dashboard view (Sections). Paste into the dashboard raw configuration editor
# under `views:` (or as a new dashboard). Needs HACS: Gauge Card Pro, apexcharts-card, card-mod.
# Gauge Card Pro: after the HACS download make sure Settings > Dashboards > Resources has
#   /hacsfiles/gauge-card-pro/gauge-card-pro.js  (JavaScript module), then hard-refresh the browser
#   (iPhone app: Settings > Companion app > Debugging > Reset frontend cache).
# The individual stacks are also in gauge-stack.yaml and right-column.yaml.
views:
  - title: Water
    path: water
    type: sections
    max_columns: 3
    theme: water_wide        # optional - see config/homeassistant/themes/water_wide.yaml
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: vertical-stack
            grid_options:
              columns: full
            cards:
              - type: heading
                heading: Current draw
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: custom:gauge-card-pro
                    entity: sensor.utility_room_esp32_utility_room_current_draw_volume
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 80 -%}{%- set r = 170 -%}{%- set m = 250 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.1f' | format(states(entity) | float(0)) }}"
                        unit_of_measurement: L
                    titles:
                      primary:
                        value: Volume
                  - type: custom:gauge-card-pro
                    entity: sensor.current_draw_cost
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 0.4 -%}{%- set r = 0.85 -%}{%- set m = 1.25 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.2f' | format(states(entity) | float(0)) }}"
                        unit_of_measurement: "£"
                        unit_before_value: true
                    titles:
                      primary:
                        value: Cost
                  - type: custom:gauge-card-pro
                    entity: sensor.utility_room_esp32_utility_room_current_draw_time
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set p = states(entity).split(':') -%}
                      {%- set v = ((p[0] | int(0)) * 60 + (p[1] | int(0))) if p | length == 2 else 0 -%}
                      {%- set a = 300 -%}{%- set r = 630 -%}{%- set m = 930 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ states(entity) }}"
                    titles:
                      primary:
                        value: Time
                  - type: custom:gauge-card-pro
                    entity: sensor.utility_room_esp32_utility_room_mains_water_flow
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 8 -%}{%- set r = 18 -%}{%- set m = 20.1 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.1f' | format(states(entity) | float(0)) }}"
                        unit_of_measurement: L/min
                    titles:
                      primary:
                        value: Flow
              - type: heading
                heading: Last draw
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: custom:gauge-card-pro
                    entity: sensor.utility_room_esp32_utility_room_last_draw_volume
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 80 -%}{%- set r = 170 -%}{%- set m = 250 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.1f' | format(states(entity) | float(0)) }}"
                        unit_of_measurement: L
                    titles:
                      primary:
                        value: Volume
                  - type: custom:gauge-card-pro
                    entity: sensor.last_draw_cost
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 0.4 -%}{%- set r = 0.85 -%}{%- set m = 1.25 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.2f' | format(states(entity) | float(0)) }}"
                        unit_of_measurement: "£"
                        unit_before_value: true
                    titles:
                      primary:
                        value: Cost
                  - type: custom:gauge-card-pro
                    entity: sensor.utility_room_esp32_utility_room_last_draw_duration
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set t = states(entity) -%}
                      {%- set n = t | regex_findall('[0-9]+') | map('int') | list -%}
                      {%- set v = (n[0] * 60 + n[1]) if ('min' in t and n | length >= 2) else (n[0] if n | length >= 1 else 0) -%}
                      {%- set a = 300 -%}{%- set r = 630 -%}{%- set m = 930 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: >-
                          {%- set t = states(entity) -%}
                          {%- set n = t | regex_findall('[0-9]+') | map('int') | list -%}
                          {%- set s = (n[0] * 60 + n[1]) if ('min' in t and n | length >= 2) else (n[0] if n | length >= 1 else 0) -%}
                          {{ '%d:%02d' | format(s // 60, s % 60) }}
                    titles:
                      primary:
                        value: Time
                  - type: custom:gauge-card-pro
                    entity: sensor.utility_room_esp32_utility_room_last_draw_peak_flow
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 8 -%}{%- set r = 18 -%}{%- set m = 20.1 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.1f' | format(states(entity) | float(0)) }}"
                        unit_of_measurement: L/min
                    titles:
                      primary:
                        value: Peak Flow
              - type: heading
                heading: Totals
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:gauge-card-pro
                    entity: sensor.today_s_water_usage_rounded
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 550 -%}{%- set r = 900 -%}{%- set m = 1200 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.0f' | format(states(entity) | float(0)) }}"
                        unit_of_measurement: L
                    titles:
                      primary:
                        value: Today
                  - type: custom:gauge-card-pro
                    entity: sensor.water_monthly
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 16500 -%}{%- set r = 27000 -%}{%- set m = 36000 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.1f' | format((states(entity) | float(0)) / 1000) }}"
                        unit_of_measurement: m³
                    titles:
                      primary:
                        value: This Month
                  - type: custom:gauge-card-pro
                    entity: sensor.water_quarterly
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 50600 -%}{%- set r = 82800 -%}{%- set m = 110400 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.1f' | format((states(entity) | float(0)) / 1000) }}"
                        unit_of_measurement: m³
                    titles:
                      primary:
                        value: This Quarter
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:gauge-card-pro
                    entity: sensor.water_cost_today
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 2.75 -%}{%- set r = 4.5 -%}{%- set m = 6.0 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.2f' | format(states(entity) | float(0)) }}"
                        unit_of_measurement: "£"
                        unit_before_value: true
                    titles:
                      primary:
                        value: Cost Today
                  - type: custom:gauge-card-pro
                    entity: sensor.water_cost_this_month
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 82.7 -%}{%- set r = 135.3 -%}{%- set m = 180.4 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.2f' | format(states(entity) | float(0)) }}"
                        unit_of_measurement: "£"
                        unit_before_value: true
                    titles:
                      primary:
                        value: Cost This Month
                  - type: custom:gauge-card-pro
                    entity: sensor.water_cost_this_quarter
                    min: 0
                    max: 100
                    needle: true
                    value: >-
                      {%- set v = states(entity) | float(0) -%}
                      {%- set a = 296.9 -%}{%- set r = 458.3 -%}{%- set m = 596.6 -%}
                      {{ (33.33 * ((v / a) | sqrt)) if v <= a else ((33.33 + (v - a) / (r - a) * 33.33) if v <= r else ([66.66 + (v - r) / (m - r) * 33.34, 100] | min)) }}
                    segments:
                      - from: 0
                        color: "#4caf50"
                      - from: 33.33
                        color: "#ffc107"
                      - from: 66.66
                        color: "#f44336"
                    value_texts:
                      primary:
                        value: "{{ '%.2f' | format(states(entity) | float(0)) }}"
                        unit_of_measurement: "£"
                        unit_before_value: true
                    titles:
                      primary:
                        value: Cost This Quarter
      - type: grid
        column_span: 1
        cards:
          - type: vertical-stack
            grid_options:
              columns: full
            cards:
              - type: horizontal-stack
                cards:
                  - type: entities
                    title: Water status
                    card_mod:
                      style: |
                        #states > * {
                          margin-top: -2px !important;
                          margin-bottom: -2px !important;
                        }
                    entities:
                      - type: conditional
                        conditions:
                          - condition: numeric_state
                            entity: sensor.utility_room_esp32_utility_room_meter_stats_error_code_status
                            below: 0.5
                        row:
                          type: text
                          name: Status
                          icon: mdi:water-check
                          text: Normal
                      - type: conditional
                        conditions:
                          - condition: not
                            conditions:
                              - condition: numeric_state
                                entity: sensor.utility_room_esp32_utility_room_meter_stats_error_code_status
                                below: 0.5
                        row:
                          type: text
                          name: Status
                          icon: mdi:water-alert
                          text: Check meter
                      - entity: sensor.esp32_utility_room_mains_water_pressure_2
                        name: Pressure
                      - entity: sensor.utility_room_esp32_utility_room_mains_water_flow
                        name: Flow
                      - entity: sensor.utility_room_esp32_utility_room_meter_stats_signal_quality
                        name: Quality
                      - entity: sensor.utility_room_esp32_utility_room_meter_stats_travel_time_ratio
                        name: TT Ratio
                      - entity: sensor.utility_room_esp32_utility_room_meter_stats_fluid_sound_speed
                        name: Sound Speed
                  - type: entities
                    title: Water bill
                    entities:
                      - entity: sensor.water_since_last_bill
                        name: Used
                      - entity: sensor.water_cost_since_last_bill
                        name: Usage £
                      - entity: sensor.water_cost_this_quarter
                        name: Quarter £
                      - type: button
                        name: New bill
                        icon: mdi:receipt-text
                        action_name: START
                        tap_action:
                          action: perform-action
                          perform_action: script.turn_on
                          target:
                            entity_id: script.water_new_bill_starts_now
                          confirmation:
                            text: Start a new bill period from now?
              - type: custom:apexcharts-card
                header:
                  show: true
                  title: Water draws (litres each, 24 h)
                graph_span: 1d
                apex_config:
                  chart:
                    height: 170
                  plotOptions:
                    bar:
                      colors:
                        ranges:
                          - from: 0
                            to: 79.99
                            color: "#4caf50"
                          - from: 80
                            to: 169.99
                            color: "#ffc107"
                          - from: 170
                            to: 1000
                            color: "#f44336"
                series:
                  - entity: sensor.utility_room_esp32_utility_room_last_draw_volume
                    type: column
                    group_by:
                      func: raw
              - type: custom:apexcharts-card
                header:
                  show: true
                  title: Water pressure (24 h)
                graph_span: 24h
                apex_config:
                  chart:
                    height: 140
                yaxis:
                  - decimals: 2
                series:
                  - entity: sensor.esp32_utility_room_mains_water_pressure_2
                    name: Pressure (bar)
                    type: line
                    stroke_width: 2
                    group_by:
                      func: avg
                      duration: 5min
