# =============================================================================
# esp32-utility-room.yaml - TUF-2000M ultrasonic flow meter + SEN0257 pressure
# ESPHome 2026.9.x, ESP32-S3-DevKitC-1 (16 MB), ESP-IDF
#
# Part of: tuf2000m-esphome-water-monitor  (see README.md and docs/)
# All credentials are !secret references - copy secrets.example.yaml to
# /config/esphome/secrets.yaml and fill in your own values.
#
# The flow-correction lookup table is SPECIFIC TO ONE INSTALLATION
# (22 mm copper, TS-2 transducers, Standard S type, W method, 24.41 mm spacing,
# M45 = 1.5). Re-calibrate before using it on your own pipe: docs/04-calibration-and-testing.md
# =============================================================================

substitutions:
  pressure_zero_v: "0.454"        # measured at 0 pressure, sensor open to air
  pressure_full_scale_bar: "16.0" # SEN0257: 0-1.6 MPa
  # Flow correction: lookup table in the "Mains Water Flow" sensor below (M45 = 1.5, Standard S, W, 24.41 mm,
  # zero reset done). Re-fit if M45, M41, M42/M43, M23/M24 or the sensors are changed.
  flow_deadband: "0.15"           # meter L/min at or below this counts as zero
  flow_low_top: "0.9"             # meter L/min below this is "low flow" for the drift guard
  flow_low_max_s: "120"           # seconds of continuous low flow counted before it is treated as drift
  # Draw tracking
  draw_threshold_lmin: "0.25"     # corrected L/min at or above this starts a draw
  draw_end_gap_s: "2"             # seconds below the threshold before a draw is over

esphome:
  name: esp32-utility-room
  friendly_name: ESP32 Utility Room
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(draw_number).publish_state(id(draw_count));
          id(current_draw_l).publish_state(0.0f);
          id(current_draw_time).publish_state("0:00");

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0
  deassert_rts_dtr: true

mqtt:                             # not used by anything now; delete it if you prefer
  id: mqtt_client
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  keepalive: 60s

api:
  encryption:
    key: !secret esp32_utility_room_key
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Utility Room Fallback Hotspot"
    password: !secret utility_room_ap_password   # 8+ characters

captive_portal:

# --- Bluetooth: Bermuda only (passive, advertisement-only) ---
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: false

bluetooth_proxy:
  active: false

# --- Time, for the draw timestamps ---
time:
  - platform: homeassistant
    id: ha_time

# --- Draw tracking state ---
globals:
  - id: draw_active
    type: bool
    initial_value: "false"
  - id: draw_litres
    type: float
    initial_value: "0.0"
  - id: draw_raw_litres
    type: float
    initial_value: "0.0"
  - id: draw_seconds
    type: float
    initial_value: "0.0"
  - id: draw_quiet_s
    type: float
    initial_value: "0.0"
  - id: draw_peak
    type: float
    initial_value: "0.0"
  - id: draw_last_sec
    type: int
    initial_value: "0"
  - id: draw_count
    type: int
    restore_value: true
    initial_value: "0"

# --- Draw tracker: every 0.5 s, corrected flow + raw meter flow; also the m:ss stopwatch ---
interval:
  - interval: 0.5s
    then:
      - lambda: |-
          static uint32_t last_ms = 0;
          uint32_t now_ms = millis();
          float dt = last_ms ? (now_ms - last_ms) / 1000.0f : 0.5f;
          last_ms = now_ms;
          if (dt > 5.0f) dt = 5.0f;

          float f = 0.0f;
          if (id(flow_corrected_lmin).has_state() && !std::isnan(id(flow_corrected_lmin).state))
            f = id(flow_corrected_lmin).state;
          float r = 0.0f;
          if (id(meter_flow_lmin).has_state() && !std::isnan(id(meter_flow_lmin).state))
            r = id(meter_flow_lmin).state;
          const float thr = ${draw_threshold_lmin};
          const float gap = ${draw_end_gap_s};

          if (!id(draw_active)) {
            if (f >= thr) {
              id(draw_active) = true;
              id(draw_litres) = f * dt / 60.0f;
              id(draw_raw_litres) = r * dt / 60.0f;
              id(draw_seconds) = dt;
              id(draw_quiet_s) = 0.0f;
              id(draw_peak) = f;
              id(draw_last_sec) = 0;
              id(water_draw_active).publish_state(true);
              id(current_draw_l).publish_state(id(draw_litres));
              id(current_draw_time).publish_state("0:00");
            }
          } else {
            id(draw_seconds) += dt;
            id(draw_litres) += f * dt / 60.0f;
            id(draw_raw_litres) += r * dt / 60.0f;
            if (f >= thr) {
              id(draw_quiet_s) = 0.0f;
              if (f > id(draw_peak)) id(draw_peak) = f;
            } else {
              id(draw_quiet_s) += dt;
            }
            id(current_draw_l).publish_state(id(draw_litres));

            float act_f = id(draw_seconds) - id(draw_quiet_s);
            if (act_f < 0.0f) act_f = 0.0f;
            int act = (int)(act_f + 0.5f);
            if (act != id(draw_last_sec)) {
              id(draw_last_sec) = act;
              char tb[12];
              snprintf(tb, sizeof(tb), "%d:%02d", act / 60, act % 60);
              id(current_draw_time).publish_state(tb);
            }

            if (id(draw_quiet_s) >= gap) {
              float dur = id(draw_seconds) - id(draw_quiet_s);
              if (dur < 0.0f) dur = 0.0f;
              int total_s = (int)(dur + 0.5f);
              int mins = total_s / 60;
              int secs = total_s % 60;
              char buf[24];
              if (mins > 0) snprintf(buf, sizeof(buf), "%d min %02d s", mins, secs);
              else snprintf(buf, sizeof(buf), "%d s", secs);

              // two identical draws must still be two distinct states in HA
              static float prev_vol = -1.0f;
              float vol = id(draw_litres);
              if (fabsf(vol - prev_vol) < 0.0005f) vol += 0.001f;
              prev_vol = vol;

              id(draw_count) += 1;
              std::string ts = "no time";
              auto t = id(ha_time).now();
              if (t.is_valid()) ts = t.strftime("%Y-%m-%d %H:%M:%S");
              char logbuf[120];
              snprintf(logbuf, sizeof(logbuf), "%s | %.2f L | %s | peak %.2f L/min",
                       ts.c_str(), id(draw_litres), buf, id(draw_peak));

              id(last_draw_l).publish_state(vol);
              id(last_draw_raw_l).publish_state(id(draw_raw_litres));
              id(last_draw_duration).publish_state(buf);
              id(last_draw_peak).publish_state(id(draw_peak));
              id(last_draw_finished).publish_state(ts);
              id(last_draw_log).publish_state(logbuf);
              id(draw_number).publish_state(id(draw_count));

              id(draw_active) = false;
              id(water_draw_active).publish_state(false);
              id(current_draw_l).publish_state(0.0f);
              id(current_draw_time).publish_state("0:00");
            }
          }

# --- MAX485 to TUF-2000M ---
# DI -> GPIO41, DE+RE -> GPIO2
# RO -> Wago -> 10k -> GPIO38 (read) -> 10k -> GPIO21 (bridge pad) -> 10k -> GND
uart:
  id: modbus_uart
  tx_pin: GPIO41
  rx_pin: GPIO38
  baud_rate: 9600
  flow_control_pin: GPIO2

modbus:
  id: modbus1
  uart_id: modbus_uart
  send_wait_time: 400ms           # default 2000 ms: a failed frame blocked the bus for 2 s
  turnaround_time: 100ms

modbus_controller:
  - id: tuf2000m                  # fast: flow, 1 s
    address: 1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 1s
  - id: tuf2000m_slow             # slow: Meter Stats diagnostics, 60 s
    address: 1
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 60s

sensor:
  # --- Raw flow from the meter, m3/h, internal (not shown in HA) ---
  # protocol address = manual register number - 1; REAL4 low word first -> FP32_R
  - platform: modbus_controller
    modbus_controller_id: tuf2000m
    id: flow_rate_m3h
    name: "Meter Flow Rate"
    internal: true
    register_type: holding
    address: 0
    value_type: FP32_R
    unit_of_measurement: "m³/h"
    accuracy_decimals: 3
    state_class: measurement

  - platform: template
    id: meter_flow_lmin
    name: "Meter Flow (uncorrected)"
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    state_class: measurement
    entity_category: diagnostic
    update_interval: 0.5s
    lambda: |-
      if (!id(flow_rate_m3h).has_state()) return {};
      return id(flow_rate_m3h).state * 1000.0 / 60.0;

  # Corrected flow: meter L/min -> true L/min by straight lines between measured points.
  # Below 0.6 the points are extrapolated (not measured). At or above the last point the true flow is 20.08.
  # Drift guard: a flow below flow_low_top lasting longer than flow_low_max_s counts as zero.
  - platform: template
    id: flow_corrected_lmin
    name: "Mains Water Flow"
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 0.5s
    lambda: |-
      static float low_s = 0.0f;
      static uint32_t last_ms = 0;
      uint32_t now_ms = millis();
      float dt = last_ms ? (now_ms - last_ms) / 1000.0f : 0.5f;
      last_ms = now_ms;
      if (dt > 5.0f) dt = 5.0f;
      if (!id(meter_flow_lmin).has_state()) return {};
      float m = id(meter_flow_lmin).state;
      if (std::isnan(m)) return {};
      static const float M[] = {0.15f, 0.375f, 0.6f, 1.12f, 1.905f, 3.78f, 5.88f, 9.48f};
      static const float Q[] = {0.38f, 0.95f, 1.5f, 2.74f, 4.335f, 7.92f, 11.79f, 20.08f};
      const int N = 8;
      id(flow_at_limit).publish_state(m >= M[N - 1] - 0.2f);
      if (m <= ${flow_deadband}) {
        low_s = 0.0f;
        id(low_flow_suppressed).publish_state(false);
        return 0.0f;
      }
      if (m < ${flow_low_top}) {
        low_s += dt;
        if (low_s > ${flow_low_max_s}) {
          id(low_flow_suppressed).publish_state(true);
          return 0.0f;
        }
      } else {
        low_s = 0.0f;
        id(low_flow_suppressed).publish_state(false);
      }
      if (m >= M[N - 1]) return Q[N - 1];
      for (int i = 1; i < N; i++) {
        if (m <= M[i]) {
          return Q[i - 1] + (m - M[i - 1]) * (Q[i] - Q[i - 1]) / (M[i] - M[i - 1]);
        }
      }
      return Q[N - 1];

  # Corrected total, litres
  - platform: integration
    id: water_used_l
    name: "Mains Water Used"
    sensor: flow_corrected_lmin
    time_unit: min
    restore: true
    unit_of_measurement: "L"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 2

  # --- Draw tracking outputs ---
  - platform: template
    id: current_draw_l
    name: "Current Draw Volume"
    unit_of_measurement: "L"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: never
  - platform: template
    id: last_draw_l
    name: "Last Draw Volume"
    unit_of_measurement: "L"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: never
  - platform: template
    id: last_draw_raw_l
    name: "Core - Last Draw Raw Volume (uncorrected)"
    unit_of_measurement: "L"
    accuracy_decimals: 2
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: last_draw_peak
    name: "Last Draw Peak Flow"
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: never
  - platform: template
    id: draw_number
    name: "Draw Count"
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never

  # --- Meter Stats (slow controller). address = manual number - 1; FP32_R unless stated ---
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Flow Velocity"
    entity_category: diagnostic
    register_type: holding
    address: 4
    value_type: FP32_R
    unit_of_measurement: "m/s"
    accuracy_decimals: 3
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Fluid Sound Speed"
    entity_category: diagnostic
    register_type: holding
    address: 6
    value_type: FP32_R
    unit_of_measurement: "m/s"
    accuracy_decimals: 1
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Total (Positive)"
    entity_category: diagnostic
    register_type: holding
    address: 114
    value_type: FP32_R
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 4
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Total (Negative)"
    entity_category: diagnostic
    register_type: holding
    address: 116
    value_type: FP32_R
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    state_class: total_increasing
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Flow Today"
    entity_category: diagnostic
    register_type: holding
    address: 124
    value_type: FP32_R
    unit_of_measurement: "m³"
    accuracy_decimals: 3
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Flow This Month"
    entity_category: diagnostic
    register_type: holding
    address: 126
    value_type: FP32_R
    unit_of_measurement: "m³"
    accuracy_decimals: 3
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Signal Quality"
    entity_category: diagnostic
    register_type: holding
    address: 91
    value_type: U_WORD
    bitmask: 0x00FF
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - TS2 Upstream Strength"
    entity_category: diagnostic
    register_type: holding
    address: 92
    value_type: U_WORD
    accuracy_decimals: 2
    state_class: measurement
    filters:
      - multiply: 0.0244          # raw count 3141 = display 76.6
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - TS2 Downstream Strength"
    entity_category: diagnostic
    register_type: holding
    address: 93
    value_type: U_WORD
    accuracy_decimals: 2
    state_class: measurement
    filters:
      - multiply: 0.0244
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Travel Time Ratio"
    entity_category: diagnostic
    register_type: holding
    address: 96
    value_type: FP32_R
    unit_of_measurement: "%"
    accuracy_decimals: 2
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Error Code Status"
    entity_category: diagnostic
    register_type: holding
    address: 71
    value_type: U_WORD
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Reynolds Number"
    entity_category: diagnostic
    register_type: holding
    address: 98
    value_type: FP32_R
    accuracy_decimals: 2
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Pipe Factor"
    entity_category: diagnostic
    register_type: holding
    address: 100
    value_type: FP32_R
    accuracy_decimals: 3
    state_class: measurement
  - platform: modbus_controller
    modbus_controller_id: tuf2000m_slow
    name: "Meter Stats - Working Timer"
    entity_category: diagnostic
    register_type: holding
    address: 102
    value_type: U_DWORD_R
    unit_of_measurement: "s"
    accuracy_decimals: 0

  # --- Water pressure: DFRobot SEN0257 (red 5 V, black GND, yellow -> Wago -> 10k -> GPIO9 -> 10k -> GPIO12 pad -> 10k -> GND) ---
  - platform: adc
    pin: GPIO9
    id: pressure_sensor_raw
    name: "Utility Pressure Raw Voltage"
    attenuation: 12db
    samples: 16
    update_interval: 1s
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - sliding_window_moving_average:
          window_size: 10
          send_every: 5
  - platform: template
    name: "Utility Pressure Sensor Output Voltage"
    id: pressure_sensor_v
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      if (!id(pressure_sensor_raw).has_state()) return {};
      return id(pressure_sensor_raw).state / 0.6667;
  - platform: template
    name: "Mains Water Pressure"
    id: mains_pressure
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      if (!id(pressure_sensor_v).has_state()) return {};
      return ((id(pressure_sensor_v).state - ${pressure_zero_v}) / 4.0) * ${pressure_full_scale_bar};

  # --- Board health ---
  - platform: wifi_signal
    name: "Utility Room WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Utility Room Uptime"

  # --- OPTIONAL, NOT YET FITTED: strap-on 10k NTC on the pipe (3.3 V - 10k - GPIO4 - NTC - GND, 100 nF across NTC) ---
  # - platform: adc
  #   pin: GPIO4
  #   id: pipe_ntc_adc
  #   attenuation: 12db
  #   samples: 16
  #   update_interval: 10s
  # - platform: resistance
  #   id: pipe_ntc_res
  #   sensor: pipe_ntc_adc
  #   configuration: DOWNSTREAM
  #   resistor: 10kOhm
  # - platform: ntc
  #   sensor: pipe_ntc_res
  #   name: "Mains Pipe Temperature"
  #   unit_of_measurement: "°C"
  #   accuracy_decimals: 1
  #   calibration:
  #     b_constant: 3977
  #     reference_temperature: 25°C
  #     reference_resistance: 10kOhm
  #   filters:
  #     - sliding_window_moving_average:
  #         window_size: 6
  #         send_every: 3

text_sensor:
  - platform: template
    id: last_draw_finished
    name: "Last Draw Finished"
  - platform: template
    id: last_draw_duration
    name: "Last Draw Duration"
  - platform: template
    id: last_draw_log
    name: "Last Draw Log"
  - platform: template
    id: current_draw_time
    name: "Current Draw Time"

binary_sensor:
  - platform: status
    name: "Utility Room Online"
  - platform: template
    id: water_draw_active
    name: "Water Draw Active"
  - platform: template
    id: low_flow_suppressed
    name: "Core - Low Flow Suppressed (drift guard)"
    entity_category: diagnostic
  - platform: template
    id: flow_at_limit
    name: "Core - Flow At Meter Limit"
    entity_category: diagnostic
