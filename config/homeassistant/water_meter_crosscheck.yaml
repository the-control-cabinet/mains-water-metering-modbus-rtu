# Cross-check of the TUF-2000M ultrasonic meter against Yorkshire Water's smart meter (13 Nov 2026).
# Yorkshire Water's daily reading arrives with a ~4-day lag (integration dan-simms1/ha-yorkshire-water),
# so the TUF's daily total (utility meter sensor.water_daily, litres, resets at midnight) is recorded
# each night at 23:59:50 and kept for 14 days; the comparison matches the date of YW's latest reading.
# Note: the YW entity IDs contain the account reference; keep them out of published material.
# 18 Nov 2026: cross-check returns none (not the text "unknown") when there's no match, which removes
#   the "invalid state" warning on this % sensor; YW reading_date cut to YYYY-MM-DD before matching;
#   nightly snapshot skips the night if sensor.water_daily isn't numeric (no false 0 L days).

template:
  - trigger:
      - platform: time
        at: "23:59:50"
    sensor:
      - name: "TUF daily totals"
        unique_id: tuf_daily_totals
        unit_of_measurement: "L"
        icon: mdi:water-check
        state: >
          {% set v = states('sensor.water_daily') %}
          {% if is_number(v) %}
            {{ v | float | round(1) }}
          {% elif is_number(this.state) %}
            {{ this.state }}
          {% else %}
            {{ none }}
          {% endif %}
        attributes:
          history: >
            {% set old = this.attributes.history if this.attributes is defined and this.attributes.history is defined else [] %}
            {% set today = now().strftime('%Y-%m-%d') %}
            {% set v = states('sensor.water_daily') %}
            {% if is_number(v) %}
              {% set kept = old | rejectattr('0', 'eq', today) | list %}
              {{ (kept + [[today, v | float | round(1)]])[-14:] }}
            {% else %}
              {{ old }}
            {% endif %}

  - sensor:
      - name: "Water meter cross-check"
        unique_id: water_meter_crosscheck_tuf_vs_yw
        unit_of_measurement: "%"
        icon: mdi:scale-balance
        state: >
          {% set yw = states('sensor.<yw_account_ref>_latest_daily_consumption') | float(0) %}
          {% set d = state_attr('sensor.<yw_account_ref>_latest_daily_consumption', 'reading_date') %}
          {% set ds = (d | string)[:10] if d is not none else '' %}
          {% set hist = state_attr('sensor.tuf_daily_totals', 'history') or [] %}
          {% set match = hist | selectattr('0', 'eq', ds) | list %}
          {% if yw > 0 and ds != '' and match | count > 0 %}
            {{ ((match[0][1] - yw) / yw * 100) | round(1) }}
          {% else %}
            {{ none }}
          {% endif %}
        attributes:
          reading_date: "{{ state_attr('sensor.<yw_account_ref>_latest_daily_consumption', 'reading_date') }}"
          yorkshire_water_litres: "{{ states('sensor.<yw_account_ref>_latest_daily_consumption') }}"
          tuf_litres: >
            {% set d = state_attr('sensor.<yw_account_ref>_latest_daily_consumption', 'reading_date') %}
            {% set ds = (d | string)[:10] if d is not none else '' %}
            {% set hist = state_attr('sensor.tuf_daily_totals', 'history') or [] %}
            {% set match = hist | selectattr('0', 'eq', ds) | list %}
            {{ match[0][1] if match | count > 0 else 'not recorded (TUF history starts 13 Nov 2026)' }}
          meaning: "Positive = the TUF reads higher than Yorkshire Water's meter for that day"
